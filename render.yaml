##############################################################################
# Render Blueprint - Textile & Apparel ERP + MES Platform
# Production Infrastructure as Code (IaC)
##############################################################################

databases:
  # -- 1. PostgreSQL Database ------------------------------------------------
  - name: erp-mes-postgres
    databaseName: textile_erp
    user: postgres
    region: oregon
    plan: free
    postgresMajorVersion: "16"

services:
  # -- 2. NestJS API Web Service ---------------------------------------------
  - type: web
    name: erp-mes-api
    runtime: node
    region: oregon
    plan: free

    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @textile-erp/database run db:generate && pnpm --filter api run build
    startCommand: pnpm --filter @textile-erp/database run db:deploy && node apps/api/dist/main.js

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: erp-mes-postgres
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

  # -- 3. Next.js Frontend Web Service ---------------------------------------
  - type: web
    name: erp-mes-web
    runtime: node
    region: oregon
    plan: free

    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter web run build
    startCommand: pnpm --filter web run start -- -p 10000 -H 0.0.0.0

    healthCheckPath: /

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_URL
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false